<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        #ui {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
        }
        button {
            font-size: 24px; padding: 20px 40px;
            background: #007aff; color: white;
            border: none; border-radius: 15px;
        }
    </style>
    
    <!-- Рабочая версия 1.2.5 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <!-- A-Frame совместимой версии -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <div id="ui">
        <button onclick="run()">▶ ЗАПУСТИТЬ КАМЕРУ</button>
    </div>

    <a-scene id="scene"
             mindar-image="imageTargetSrc: target.mind;"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false"
             embedded
             style="display: none;">
        <a-camera position="0 0 0"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="model.glb" scale="0.5 0.5 0.5" position="0 0 0.1"></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        function run() {
            document.getElementById('ui').style.display = 'none';
            var scene = document.getElementById('scene');
            scene.style.display = 'block';
        }
    </script>
</body>
</html>
