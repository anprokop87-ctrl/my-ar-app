<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background-color: black;
        position: fixed;
      }
    </style>
  </head>
  <body>
    <a-scene 
      id="ar-scene"
      mindar-image="imageTargetSrc: target.mind; filterMinCF: 0.01; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 10;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="model.glb"
          position="0 0 0"
          scale="0.15 0.15 0.15"
          rotation="0 0 0"
          animation-mixer>
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      // Принудительно задаём параметры видео для всех браузеров
      window.addEventListener('load', function() {
        var scene = document.getElementById('ar-scene');
        
        scene.addEventListener('arReady', function() {
          var video = document.querySelector('video');
          if (video && video.srcObject) {
            var track = video.srcObject.getVideoTracks()[0];
            if (track) {
              // Пытаемся установить высокое разрешение и частоту кадров
              track.applyConstraints({
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30 }
              }).catch(function() {
                // Если не получилось — ок, используем что есть
              });
            }
          }
        });
      });
    </script>
  </body>
</html>
