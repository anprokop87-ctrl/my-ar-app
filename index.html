<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой AR</title>
    <!-- Библиотека распознавания Mind AR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.9.5/dist/mindar-image.prod.js"></script>
    <!-- Библиотека 3D-движка A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Мост между Mind AR и A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.9.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: target.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Объект, который появится поверх метки -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                rotation="0 0 0" 
                position="0 0 0.1" 
                scale="0.5 0.5 0.5" 
                src="model.glb" 
                animation-mixer>
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
