<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background-color: black;
        position: fixed;
      }
      
      /* Кнопка внизу экрана */
      #think-btn {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none; /* Скрыта по умолчанию */
        
        font-size: 18px;
        padding: 14px 36px;
        background: rgba(0, 122, 255, 0.9);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 30px;
        font-family: -apple-system, sans-serif;
        cursor: pointer;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <a-scene 
      id="ar-scene"
      mindar-image="imageTargetSrc: target.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="model.glb"
          position="0 0 0"
          scale="1 1 1"
          rotation="0 90 90"
          animation-mixer>
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <!-- Кнопка «Подумать» -->
    <button id="think-btn" onclick="openLink()">💭 Подумать</button>

    <script>
      // Ссылка, которая откроется при нажатии
      var thinkLink = 'https://example.com'; // ← ЗАМЕНИТЕ НА ВАШУ ССЫЛКУ
      
      function openLink() {
        window.open(thinkLink, '_blank');
      }
      
      // Показываем/прячем кнопку при обнаружении/потере метки
      window.addEventListener('load', function() {
        var scene = document.getElementById('ar-scene');
        var thinkBtn = document.getElementById('think-btn');
        
        // Когда метка обнаружена
        scene.addEventListener('targetFound', function() {
          thinkBtn.style.display = 'block';
        });
        
        // Когда метка потеряна
        scene.addEventListener('targetLost', function() {
          thinkBtn.style.display = 'none';
        });
      });
    </script>
  </body>
</html>
