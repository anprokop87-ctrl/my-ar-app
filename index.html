<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Подключаем Science Gothic через Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic&display=swap" rel="stylesheet">
    
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background-color: black;
        position: fixed;
      }
      
      /* Кнопка внизу экрана */
      #think-btn {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
        
        font-family: 'Science Gothic', sans-serif;
        font-size: 20px;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 1px;
        
        /* Белый цвет с чёрной обводкой */
        color: white;
        -webkit-text-stroke: 1.5px black;
        text-stroke: 1.5px black;
        
        /* Убираем фон и рамку */
        background: none;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 10px 0;
      }
    </style>
  </head>
  <body>
    <a-scene 
      id="ar-scene"
      mindar-image="imageTargetSrc: target.mind; filterMinCF: 0.01; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 10;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="model.glb"
          position="0 0 0"
          scale="0.15 0.15 0.15"
          rotation="0 0 0"
          animation-mixer>
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <button id="think-btn" onclick="openLink()">ПОДУМАТЬ</button>

    <script>
      var thinkLink = 'https://example.com'; // ← ЗАМЕНИТЕ НА ВАШУ ССЫЛКУ
      
      function openLink() {
        window.open(thinkLink, '_blank');
      }
      
      window.addEventListener('load', function() {
        var scene = document.getElementById('ar-scene');
        var thinkBtn = document.getElementById('think-btn');
        
        scene.addEventListener('targetFound', function() {
          thinkBtn.style.display = 'block';
        });
        
        scene.addEventListener('targetLost', function() {
          thinkBtn.style.display = 'none';
        });
      });
    </script>
  </body>
</html>
