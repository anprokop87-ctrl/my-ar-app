<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: black;
            position: fixed;
        }
        #start-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #start-btn {
            font-size: 24px;
            padding: 20px 50px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,122,255,0.5);
            cursor: pointer;
            letter-spacing: 1px;
        }
        #start-hint {
            color: rgba(255,255,255,0.6);
            margin-top: 20px;
            font-family: -apple-system, sans-serif;
            font-size: 14px;
        }
    </style>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <!-- Затемнение с кнопкой -->
    <div id="start-overlay">
        <button id="start-btn">▶ ЗАПУСТИТЬ AR</button>
        <div id="start-hint">Потребуется доступ к камере</div>
    </div>

    <!-- A-Frame сцена (изначально скрыта) -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: target.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
        style="display: none;">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <a-entity mindar-image-target="targetIndex: 0">
            <a-box position="0 0 0.05" scale="0.2 0.2 0.2" color="red"></a-box>
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        document.getElementById('start-btn').addEventListener('click', function() {
            
            // Шаг 1: Сначала запрашиваем камеру, чтобы диалог появился сразу
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            })
            .then(function(tempStream) {
                
                // Шаг 2: Останавливаем временный поток (он был нужен только для диалога)
                tempStream.getTracks().forEach(function(track) {
                    track.stop();
                });
                
                // Шаг 3: Прячем затемнение
                document.getElementById('start-overlay').style.display = 'none';
                
                // Шаг 4: Показываем сцену и даём MindAR самому запросить камеру
                var scene = document.getElementById('ar-scene');
                scene.style.display = 'block';
                
                // Шаг 5: Запускаем стандартный метод MindAR
                // Поскольку пользователь уже разрешил камеру, второго диалога НЕ БУДЕТ
                scene.addEventListener('loaded', function() {
                    var mindar = scene.components['mindar-image'];
                    if (mindar) {
                        mindar.startVideo();
                    }
                });
                
                if (scene.hasLoaded) {
                    var mindar = scene.components['mindar-image'];
                    if (mindar) {
                        mindar.startVideo();
                    }
                }
            })
            .catch(function(err) {
                alert('Нет доступа к камере: ' + err.message);
            });
        });
    </script>
</body>
</html>
