<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: black;
            position: fixed;
        }
        /* Стилизуем стандартную AR-кнопку A-Frame под наш дизайн */
        .a-dialog-allow-button {
            background: #007aff !important;
            color: white !important;
            border: none !important;
            border-radius: 15px !important;
            font-size: 24px !important;
            padding: 20px 50px !important;
            box-shadow: 0 4px 20px rgba(0,122,255,0.5) !important;
            letter-spacing: 1px !important;
            font-family: -apple-system, sans-serif !important;
            text-transform: uppercase !important;
        }
        .a-dialog-deny-button {
            display: none !important;
        }
        /* Подсказка под кнопкой */
        .a-dialog-text {
            color: rgba(255,255,255,0.6) !important;
            font-family: -apple-system, sans-serif !important;
            font-size: 14px !important;
        }
    </style>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <a-scene 
        mindar-image="imageTargetSrc: target.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Временно красный куб для проверки -->
            <a-box 
                position="0 0 0.05" 
                scale="0.3 0.3 0.3" 
                color="red">
            </a-box>
            <!-- Раскомментируйте когда куб заработает:
            <a-gltf-model 
                src="model.glb"
                position="0 0 0"
                scale="0.15 0.15 0.15"
                rotation="0 0 0"
                animation-mixer>
            </a-gltf-model>
            -->
        </a-entity>
    </a-scene>

</body>
</html>
